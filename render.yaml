services:
  - type: web
    name: student-task-manager
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-task-manager-db
          property: connectionString
      - key: JPA_DDL_AUTO
        value: update

databases:
  - name: student-task-manager-db
    databaseName: student_task_manager
    user: student_task_manager
